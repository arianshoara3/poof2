<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POOF2 — جعبه‌ابزار حرفه‌ای فارسی</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">POOF2</div>
  <div class="subtitle">جعبه‌ابزار حرفه‌ای فارسی — ۹۰۰ ابزار در یک سایت</div>
</header>
<main>
  <section class="hero">
    <h1>هر ابزاری که لازم داری، همین‌جاست</h1>
    <p>بدون ثبت‌نام، بدون سرور، روی دستگاه خودت کار می‌کند.</p>
    <input id="search" type="search" placeholder="جست‌وجوی ابزار… مثلاً شمارنده کلمات" aria-label="جست‌وجوی ابزار">
    <div class="progress">
      <div class="progress-bar" id="progressBar" style="width:0%"></div>
    </div>
    <p class="count"><span id="toolCount">۰</span> از ۹۰۰ ابزار آماده است — نسخه‌ی <span id="version">v0</span></p>
  </section>
  <nav class="categories" id="categories" aria-label="دسته‌ها"></nav>
  <section class="grid" id="toolsGrid" aria-live="polite"></section>
  <p class="empty" id="emptyState">هنوز ابزاری اضافه نشده است. ابزار اول به‌زودی می‌آید.</p>
</main>
<footer>
  <p>POOF2 — ساخته‌شده توسط Muse · نسخه‌ی <span id="versionFooter">v0</span></p>
</footer>
<script src="app.js"></script>
</body>
</html>
