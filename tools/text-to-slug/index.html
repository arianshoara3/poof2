<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تبدیل متن به slug — POOF2</title>
<link rel="stylesheet" href="../../styles.css">
<style>
.tool { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }
textarea, input[type="text"] {
  width: 100%; padding: 14px;
  border-radius: 12px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text);
  font-size: 16px; line-height: 1.9; font-family: inherit;
}
textarea { min-height: 120px; resize: vertical; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
button {
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  border-radius: 99px; padding: 8px 16px; cursor: pointer; font-family: inherit;
}
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
label { display: block; margin: 16px 0 6px; color: var(--muted); }
.opts { display: flex; gap: 16px; flex-wrap: wrap; margin: 8px 0; }
.opts label { display: flex; gap: 6px; align-items: center; margin: 0; color: var(--text); }
a.back { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">POOF2</div>
  <div class="subtitle"><span data-i18n="ui.tool_label">ابزار</span> 004 — <span data-i18n="categories.text">متن و نوشتن</span></div>
  <select class="lang-select" aria-label="زبان" data-i18n-aria="ui.language"></select>
</header>
<main class="tool">
  <p><a class="back" href="../../"><span class="back-arrow" aria-hidden="true">←</span> <span data-i18n="ui.back">بازگشت به همه‌ی ابزارها</span></a></p>
  <h1 data-i18n="tools.text-to-slug.name">تبدیل متن به slug</h1>
  <p style="color:var(--muted)" data-i18n="tool_ui.text-to-slug.intro">عنوان را به یک slug تمیز برای لینک تبدیل می‌کند — روی دستگاه خودت.</p>
  <label for="input" data-i18n="tool_ui.text-to-slug.title_label">عنوان</label>
  <textarea id="input" placeholder="مثلاً: آموزش زبان آلمانی برای مبتدیان" data-i18n-placeholder="tool_ui.text-to-slug.input_placeholder"></textarea>
  <div class="opts">
    <label><span data-i18n="tool_ui.text-to-slug.separator">جداکننده:</span>
      <select id="sep" style="font-family:inherit;padding:4px 8px;border-radius:8px;">
        <option value="-" data-i18n="tool_ui.text-to-slug.hyphen">- (خط تیره)</option>
        <option value="_" data-i18n="tool_ui.text-to-slug.underscore">_ (آندرلاین)</option>
      </select>
    </label>
    <label><input type="checkbox" id="lower" checked> <span data-i18n="tool_ui.text-to-slug.lowercase">حروف انگلیسی کوچک</span></label>
  </div>
  <div class="actions">
    <button class="primary" id="convertBtn" data-i18n="tool_ui.text-to-slug.convert">تبدیل به slug</button>
    <button id="clearBtn" data-i18n="ui.clear">پاک کردن</button>
  </div>
  <label for="output" data-i18n="tool_ui.text-to-slug.result_label">slug</label>
  <input type="text" id="output" readonly placeholder="slug اینجا می‌آید…" data-i18n-placeholder="tool_ui.text-to-slug.result_placeholder">
  <div class="actions">
    <button class="primary" id="copyBtn" data-i18n="tool_ui.text-to-slug.copy_slug">کپی slug</button>
  </div>
  <p id="copied" style="color:var(--accent)"></p>
</main>
<script src="../../i18n.js"></script>
<script src="tool.js"></script>
</body>
</html>
