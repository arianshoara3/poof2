<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حذف فاصله‌های اضافه — POOF2</title>
<link rel="stylesheet" href="../../styles.css">
<style>
.tool { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }
textarea {
  width: 100%; min-height: 160px; padding: 14px;
  border-radius: 12px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text);
  font-size: 16px; line-height: 1.9; font-family: inherit; resize: vertical;
}
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
button {
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  border-radius: 99px; padding: 8px 16px; cursor: pointer; font-family: inherit;
}
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
label { display: block; margin: 16px 0 6px; color: var(--muted); }
.opts { display: flex; gap: 16px; flex-wrap: wrap; margin: 8px 0; }
.opts label { display: flex; gap: 6px; align-items: center; margin: 0; color: var(--text); }
a.back { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">POOF2</div>
  <div class="subtitle"><span data-i18n="ui.tool_label">ابزار</span> 003 — <span data-i18n="categories.text">متن و نوشتن</span></div>
  <select class="lang-select" aria-label="زبان" data-i18n-aria="ui.language"></select>
</header>
<main class="tool">
  <p><a class="back" href="../../"><span class="back-arrow" aria-hidden="true">←</span> <span data-i18n="ui.back">بازگشت به همه‌ی ابزارها</span></a></p>
  <h1 data-i18n="tools.trim-spaces.name">حذف فاصله‌های اضافه</h1>
  <p style="color:var(--muted)" data-i18n="tool_ui.trim-spaces.intro">فاصله‌های چندتایی را به یکی تبدیل می‌کند و خط‌ها را مرتب می‌کند — روی دستگاه خودت.</p>
  <label for="input" data-i18n="tool_ui.trim-spaces.input_label">متن ورودی</label>
  <textarea id="input" placeholder="متن را اینجا بنویسید…" data-i18n-placeholder="tool_ui.trim-spaces.input_placeholder"></textarea>
  <div class="opts">
    <label><input type="checkbox" id="trimLines" checked> <span data-i18n="tool_ui.trim-spaces.trim_lines">حذف فاصله اول و آخر هر خط</span></label>
    <label><input type="checkbox" id="removeEmpty" checked> <span data-i18n="tool_ui.trim-spaces.remove_empty">حذف خط‌های خالی</span></label>
  </div>
  <div class="actions">
    <button class="primary" id="cleanBtn" data-i18n="tool_ui.trim-spaces.clean">تمیز کردن متن</button>
    <button id="clearBtn" data-i18n="ui.clear">پاک کردن</button>
  </div>
  <label for="output"><span data-i18n="tool_ui.trim-spaces.result_label">نتیجه</span> — <span id="stats"></span></label>
  <textarea id="output" readonly placeholder="نتیجه اینجا می‌آید…" data-i18n-placeholder="tool_ui.trim-spaces.result_placeholder"></textarea>
  <div class="actions">
    <button class="primary" id="copyBtn" data-i18n="tool_ui.trim-spaces.copy_result">کپی نتیجه</button>
  </div>
  <p id="copied" style="color:var(--accent)"></p>
</main>
<script src="../../i18n.js"></script>
<script src="tool.js"></script>
</body>
</html>
